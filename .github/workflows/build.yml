name: Build
on: [push, pull_request, workflow_dispatch]

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Make app icons
        run: npx tauri icon app-icon.png

      - name: Build
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Canopy Windows installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Canopy portable exe
          path: src-tauri/target/release/canopy.exe

  cli:
    name: Terminal version (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Build
        run: cargo build --release --manifest-path cli/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: canopy-cli ${{ runner.os }}
          path: |
            cli/target/release/canopy-cli.exe
            cli/target/release/canopy-cli
